<!DOCTYPE html>
<!--
  ══════════════════════════════════════════════════════════════════════
  北航的一周 · 单文件文字游戏
  ──────────────────────────────────────────────────────────────────────
  文件结构
    ① <style>        全部样式（深色主题 · 手机自适应）
    ② <canvas#fw>    烟花粒子层（fixed，不吃鼠标事件）
    ③ script 块
         §1  状态      S0 / F0 / S / F，以及 clamp / hwTotal / fatigueAt 等工具
         §2  场景      const scenes = { id: { time, place, text, choices } }
         §3  常量      DAY_FIRST / TITLES / MAX_SCORE / QUOTE_TOP / ACH
         §4  结算      HEADLINE / debtList / buildFile / buildComment / showReport
         §5  引擎      resolve / renderStats / renderProg / render / apply / pick / nextDay
         §6  开场      showIntro / startWeek / restart
         §7  烟花      FW（粒子）/ boom（音效）

  改内容 → 只看 §2（场景数据）
  改平衡 → §3 常量 + §4 评分，改完必须重算 MAX_SCORE / QUOTE_TOP
  改表现 → ① 样式 与 §5 渲染

  场景 id 索引
    周一  d1a 起床 · d1b 数分 · d1c 思政(点名入口) · d1cx 被点 · d1d 晚上
    周二  d2a 起床 · d2b 程设 · d2c 百团大战 · d2d 晚上
    周三  d3a 起床 · d3b 小测 · d3c 体育 · d3cx 补点名 · d3d 晚上
    周四  d4a 英语展示 · d4b 下午 · d4c 晚上
    周五  d5a 起床 · d5b 高代 · d5c 周末分叉 · d5d 晚上
    周六  d6a 早上 · d6b 下午 · d6c 晚上 · u2 u3 u4 环球影城线
    周日  d7a 起床 · d7b 补作业 · d7c 晚上

  详细设计见《北航的一周-开发知识库.md》
  ══════════════════════════════════════════════════════════════════════
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>模拟人生 · 北航</title>
<style>
:root{
  --bg:#0d1015;--ink:#e4e7ed;--dim:#8b93a1;--faint:#5d6674;--line:#232b37;--accent:#e0a458;
  --c-energy:#e0685f;--c-study:#5f9fd6;--c-social:#6cb87a;--c-mood:#c084d8;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(1100px 560px at 50% -8%, #1b2330 0%, rgba(27,35,48,0) 62%), var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;line-height:1.9;min-height:100vh;
}
/* ── 布局 ── */
.wrap{max-width:660px;margin:0 auto;padding:0 22px 90px}
/* ── 顶栏：星期 / 时间 / 地点 / 数值条 / 一周进度 ── */
header{
  position:sticky;top:0;z-index:20;background:rgba(13,16,21,.86);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);padding:12px 22px 10px;margin:0 -22px 0;
}
.headrow{max-width:660px;margin:0 auto}
.clockline{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:9px}
.clock{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:18px;letter-spacing:.05em;color:var(--accent)}
.clock .day{font-family:inherit;font-size:13px;color:var(--dim);letter-spacing:.22em;margin-right:10px}
.where{font-size:12px;color:var(--faint);letter-spacing:.04em}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:5px 20px}
.stat{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--dim)}
.stat .k{width:26px;flex:none;letter-spacing:.05em}
.track{flex:1;height:3px;background:#1e2531;border-radius:2px;overflow:hidden}
.track i{display:block;height:100%;width:0;border-radius:2px;transition:width .55s cubic-bezier(.4,0,.2,1)}
.stat .v{width:24px;flex:none;text-align:right;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--faint)}
.prog{height:3px;background:#1b222d;margin:10px -22px 0;display:flex;gap:2px;padding:0 0}
.prog span{flex:1;height:100%;background:#1b222d;position:relative;overflow:hidden}
.prog span i{position:absolute;left:0;top:0;height:100%;width:0;background:linear-gradient(90deg,#8a6a3c,var(--accent));transition:width .8s ease}
.prog span.done i{width:100%}
/* ── 正文 ── */
main{padding-top:36px;min-height:52vh}
.place{font-size:11px;color:var(--faint);letter-spacing:.18em;margin-bottom:20px}
.prose p{margin:0 0 17px;font-size:16.5px;letter-spacing:.015em;color:#dde1e8}
.prose p:last-child{margin-bottom:0}
.prose .q{color:var(--accent)}
/* ── 选项按钮 ── */
.choices{margin-top:32px;display:flex;flex-direction:column;gap:9px}
.choice{
  display:flex;gap:13px;align-items:flex-start;width:100%;text-align:left;
  background:transparent;border:1px solid var(--line);border-radius:10px;
  padding:15px 17px;color:#c3cad6;font-size:15px;line-height:1.65;font-family:inherit;
  cursor:pointer;transition:border-color .18s, background .18s, color .18s, transform .12s;
  opacity:0;animation:rise .45s ease forwards;
}
.choice:hover{border-color:#4a5568;background:rgba(224,164,88,.055);color:#f1f3f7}
.choice:active{transform:scale(.994)}
.choice.locked{animation:none;opacity:.3;cursor:not-allowed;border-style:dashed;border-color:#1e2531}
.choice.locked:hover{background:transparent;border-color:#1e2531;color:#c3cad6;transform:none}
.choice.locked .arrow{color:#39424f}
.choice .arrow{color:var(--faint);flex:none;transition:color .18s,transform .18s}
.choice:hover .arrow{color:var(--accent);transform:translateX(2px)}
.choice em.lock{font-style:normal;font-size:11px;letter-spacing:.06em;color:#8a6a44;margin-left:9px;padding-left:9px;border-left:1px solid #3a3227;white-space:nowrap}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
/* ── 开场页 ── */
.intro{padding-top:15vh;text-align:center}
.intro h1{font-size:40px;margin:0;font-weight:600;letter-spacing:.12em;line-height:1.25}
.intro .sub{margin-top:16px;color:var(--dim);font-size:14px;letter-spacing:.14em}
.intro .desc{margin:40px auto 0;max-width:440px;color:var(--faint);font-size:14px;line-height:2}
.start{margin-top:44px;display:inline-flex;align-items:center;gap:10px;background:transparent;color:var(--accent);
  border:1px solid rgba(224,164,88,.45);border-radius:999px;padding:13px 34px;font-size:15px;font-family:inherit;
  letter-spacing:.16em;cursor:pointer;transition:.2s}
.start:hover{background:rgba(224,164,88,.1);border-color:var(--accent)}
.best{margin-top:24px;font-size:11px;color:#454e5c;letter-spacing:.1em}
.dev{position:fixed;right:20px;bottom:16px;font-size:11px;color:#55606f;letter-spacing:.1em;z-index:5}
.de{padding-top:10px}
.de h2{font-size:13px;letter-spacing:.3em;color:var(--faint);font-weight:400;margin:0 0 26px}
.de .big{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:40px;color:var(--accent);letter-spacing:.04em;margin-bottom:4px}
.de .lbl{font-size:12px;color:var(--faint);letter-spacing:.1em;margin-bottom:26px}
.rows{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 0;margin-bottom:24px}
.row{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;padding:5px 0;color:var(--dim)}
.row b{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:400;color:var(--ink);font-size:13px}
.row .up{color:#6cb87a}
.row .dn{color:#e0685f}
.note{font-size:14px;color:#b9c0cc;line-height:1.9;margin-bottom:28px}
.next{font-size:12px;color:var(--faint);letter-spacing:.08em;margin-bottom:30px;line-height:1.9}
.go{background:transparent;border:1px solid rgba(224,164,88,.5);color:var(--accent);border-radius:10px;
  padding:13px 30px;font-family:inherit;font-size:14px;letter-spacing:.12em;cursor:pointer;transition:.2s}
.go:hover{background:rgba(224,164,88,.09)}
/* ── 结算页 ── */
.rhead{text-align:center;padding:14px 0 28px;border-bottom:1px solid var(--line)}
.rhead .lab{font-size:11px;color:var(--faint);letter-spacing:.3em}
.rank{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:74px;line-height:1.1;margin:10px 0 2px;color:var(--accent);font-weight:500}
.score{font-size:13px;color:var(--dim);letter-spacing:.06em}
.score .n{font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--ink);font-size:15px}
.title{font-size:24px;margin:26px 0 4px;letter-spacing:.06em;font-weight:600}
.title-sub{font-size:13px;color:var(--dim)}
.bars{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:2.1;margin:30px 0 6px;white-space:pre;overflow-x:auto;color:var(--dim)}
.bars b{font-weight:400;color:var(--ink)}
.bars .lk{color:#98a0ad}
.bars .blank{color:#333e4e}
.bars .fill-study{color:var(--c-study)}
.bars .fill-social{color:var(--c-social)}
.bars .fill-mood{color:var(--c-mood)}
.bars .fill-energy{color:var(--c-energy)}
h3.sec{font-size:11px;letter-spacing:.28em;color:var(--faint);font-weight:400;margin:36px 0 14px}
ul.file{list-style:none;padding:0;margin:0;font-size:14px;color:#b9c0cc}
ul.file li{padding:5px 0 5px 18px;position:relative;line-height:1.8}
ul.file li:before{content:"·";position:absolute;left:2px;color:var(--accent);opacity:.75}
.comment{font-size:15.5px;line-height:2.05;color:#d3d8e1;border-left:2px solid rgba(224,164,88,.35);padding:4px 0 4px 20px;margin-top:6px}
.comment p{margin:0 0 15px}
.comment p:last-child{margin:0}
.debt{display:flex;flex-wrap:wrap;gap:8px}
.debt span{font-size:12px;color:#a9aeb9;border:1px solid rgba(224,164,88,.22);border-radius:6px;padding:5px 11px;background:rgba(224,164,88,.045)}
.debt b{color:var(--c-energy);font-weight:500;font-family:ui-monospace,Menlo,Consolas,monospace}
.rank.sss{font-size:52px;letter-spacing:.1em;background:linear-gradient(180deg,#f3d09a,#c8913f 62%,#a5712c);-webkit-background-clip:text;background-clip:text;color:transparent}
/* ── 成就 ── */
.ach{display:flex;flex-wrap:wrap;gap:8px}
.perfect{display:flex;align-items:center;justify-content:center;gap:13px;border:1px solid rgba(224,164,88,.52);
  background:linear-gradient(100deg, rgba(224,164,88,.15), rgba(224,164,88,.03) 72%);
  border-radius:12px;padding:17px 22px;margin:0 0 13px;box-shadow:0 0 34px rgba(224,164,88,.08) inset}
.perfect .pi{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:21px;color:var(--accent);line-height:1}
.perfect .pn{font-size:18px;color:#f0d9b0;letter-spacing:.16em;font-weight:600}
.ach .a{display:inline-flex;align-items:center;gap:7px;border:1px solid rgba(224,164,88,.34);background:rgba(224,164,88,.055);border-radius:999px;padding:7px 14px 7px 12px}
.ach .ai{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--accent);line-height:1}
.ach .an{font-size:13px;color:#d3d8e1;letter-spacing:.03em}
.again{margin-top:50px;display:flex;gap:12px;flex-wrap:wrap}
.again button{flex:1;min-width:150px;background:transparent;border:1px solid var(--line);border-radius:10px;color:var(--dim);
  font-family:inherit;font-size:14px;padding:14px;cursor:pointer;letter-spacing:.06em;transition:.2s}
.again button:hover{border-color:#4a5568;color:var(--ink);background:rgba(255,255,255,.02)}
.again button.pri{border-color:rgba(224,164,88,.5);color:var(--accent)}
.foot{margin-top:64px;text-align:center;font-size:11px;color:#333c49;letter-spacing:.14em}
/* ── 烟花画布 ── */
#fw{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
/* ── 开场页：插画全屏背景 ── */
.intro{
  position:relative;padding:0;min-height:100vh;text-align:center;
  display:flex;flex-direction:column;align-items:center;
}

<script>
"use strict";

/* ==================== 状态 ==================== */
const S0 = { study: 46, social: 36, mood: 56, energy: 72 };
const F0 = {
  escape: 0, late: 0, hwM: 0, hwA: 0, hwC: 0, hwE: 0, quiz: -1, pres: 0, vol: 0,
  fengru: 0, exercise: 0, phone: 0, breakfast: 0,
  crush: 0, nextEnergy: 70, earlySleep: 0, mom: 0, weekend: "rest",
  caught: 0, roll: 0, pe: 0, usj: 0, notes: 0
};
const S = Object.assign({}, S0);
const F = Object.assign({}, F0);

const DAYS = ["周一", "周二", "周三", "周四", "周五", "周六", "周日"];
let day = 0;
let energySum = 0, energyDays = 0;

const clamp = v => Math.max(0, Math.min(100, v));

/* 作业：四门课各一份，权重 数分5 / 高代5 / 程设3 / 英语2 */
function hwTotal(){ return (F.hwM?5:0) + (F.hwA?5:0) + (F.hwC?3:0) + (F.hwE?2:0); }

/* 周内疲劳：越到后面越难顶，除非早睡或运动把它抵掉 */
function fatigueAt(d){
  return Math.max(0, Math.min(40, 5 * d - 10 * F.earlySleep - 6 * F.exercise));
}
function morningEnergy(nextDay){
  return clamp(F.nextEnergy - fatigueAt(nextDay));
}

/* 思政课随机点名：p = 被点到的概率，good = 当时在不在听 */
function roll(p, good){
  F.roll = 0;
  if (Math.random() < p) {
    if (good) {
      F.roll = 1;
      S.study = clamp(S.study + 3);
      S.mood  = clamp(S.mood + 2);
    } else {
      F.roll = 2;
    }
  }
}

const BAR = ["", "█", "██", "███", "████", "█████", "██████", "███████", "████████", "█████████", "██████████"];
const pad = n => { let s = ""; for (let i = 0; i < 10 - n; i++) s += "░"; return s; };
const META = [
  { k: "energy", label: "精力", color: "var(--c-energy)" },
  { k: "study",  label: "学业", color: "var(--c-study)" },
  { k: "social", label: "社交", color: "var(--c-social)" },
  { k: "mood",   label: "心情", color: "var(--c-mood)" }
];

/* ==================== 场景 ==================== */
/*
  场景对象
    time     "08:00" 或 () => "08:00"
    place    "主M · 阶梯教室"
    guard?   () => 跳转目标，进入前强制换场
    text     () => 多行字符串，用 \n 分段
    choices  [ 选项 ]

  选项对象
    t        显示文本
    e        数值增量 { study, social, mood, energy }，可正可负
    f        () => {...}  副作用，在 e 之后执行
    go       "下一个场景 id" / () => id / "dayend" / "report"
    if?      () => bool      不满足则不显示（用于"你之前做没做过某事"）
    need?    { energy: 40 }  数值门槛，不满足则变灰不可点（用于"身体扛不扛得住"）
    needText 门槛未满足时的灰字说明

  每天的最后一个决策必须 go: "dayend"；周日最后一幕 go: "report"。
*/
const scenes = {

/* ═══════════ 周一 ═══════════ */
d1a: {
  time: "07:05", place: "大运村 · 4-666A",
  text: () => `闹钟响的时候天刚亮。
大运村到学院路校区，走路二十分钟，骑车八分钟。今天是周一，八点的工科数学分析在主M。
你摸出手机，班级群一百多条未读——大部分是昨晚有人在问数分习题第三题。
上铺的老陈已经洗漱回来了，头发还是湿的。`,
  choices: [
    { t: "起。骑车去，路上在学二买个包子", e: { energy: -4, study: 2 },
      f: () => { F.breakfast = 1; }, go: "d1b" },
    { t: "再躺十分钟，反正有共享单车", e: { energy: 2 }, go: "d1b" },
    { t: "不去了。反正数分不点名，直接睡到中午", e: { energy: 6, study: -5 },
      f: () => { F.escape++; }, go: "d1c" }
  ]
},
d1b: {
  time: "08:00", place: "主M · 阶梯教室",
  text: () => `工科数学分析的老师姓陈，讲课不用 PPT，全靠板书。
一黑板写满，擦掉，再写一黑板。粉笔灰顺着光柱往下掉。
今天讲拉格朗日中值定理，f(b)−f(a)=f′(ξ)(b−a)。他把这个式子圈了个圈，说“整个微积分就架在这上面”。
前排那个女生叫林知夏，高中跟你同班三年。她在沈元学院，和你在同一个数分大班。她的笔记写得极整齐。`,
  choices: [
    { t: "认真听，把定义和推导完整抄下来", e: { study: 9, energy: -7 }, go: "d1c" },
    { t: "拿手机拍板书，回头再看", e: { study: 3, energy: -2 }, go: "d1c" },
    { t: "趴桌上补觉。反正有教材", e: { energy: 8, study: -3 }, go: "d1c" },
    { t: "下课去找她借笔记", e: { study: 3, social: 7, energy: -3 },
      f: () => { F.crush = 1; F.notes = 1; }, go: "d1c" }
  ]
},
d1c: {
  time: "14:00", place: "主北 · 大教室",
  text: () => `思政课，两百多人的大教室。
老师在放一段纪录片，讲到酒泉的发射场，镜头扫过一排排白色的塔架。
开学第一节课他就说过：这门课会随机点名，答不上来的平时分扣一半。
后排有人在打游戏，前排有人在背单词。`,
  choices: [
    { t: "认真看，把要点记下来", e: { study: 6, energy: -6 },
      f: () => roll(0.35, true), go: () => (F.roll === 2 ? "d1cx" : "d1d") },
    { t: "坐中后排，把数分作业赶了", e: { study: 8, energy: -7 },
      f: () => roll(0.42, false), go: () => (F.roll === 2 ? "d1cx" : "d1d") },
    { t: "刷手机。导员在群里发了张海报", e: { mood: 3, social: 2 },
      f: () => roll(0.48, false), go: () => (F.roll === 2 ? "d1cx" : "d1d") },
    { t: "睡。两百人的课，没人看得见后排", e: { energy: 9, study: -3 },
      f: () => roll(0.58, false), go: () => (F.roll === 2 ? "d1cx" : "d1d") },
    { t: "翘了。回宿舍睡一觉", e: { energy: 8, study: -4 },
      f: () => { F.escape++; if (Math.random() < 0.45) F.caught = 2; }, go: "d1d" }
  ]
},

/* ---------- 14:50 被点到 ---------- */
d1cx: {
  time: "14:50", place: "主北 · 大教室",
  text: () => `“最后一排，靠窗那个，你来回答。”
整个教室的目光转过来。你就在最后三排，靠窗。
你站起来，发现纪录片已经放到第三段了——老师问的是第二段的内容。`,
  choices: [
    { t: "硬着头皮，把能想到的都说了", e: { mood: -3, study: 2 },
      f: () => { F.caught = 1; }, go: "d1d" },
    { t: "「老师，我没听清问题」", e: { mood: -5, study: -1 },
      f: () => { F.caught = 1; }, go: "d1d" },
    { t: "站着不说话，等他摆手让坐下", e: { mood: -7, social: -2 },
      f: () => { F.caught = 1; }, go: "d1d" }
  ]
},
d1d: {
  time: "22:40", place: "大运村 · 寝室",
  text: () => {
    const good = F.roll === 1
      ? `下午的思政课，老师点到你，你把第二段的要点讲了出来。

function debtList(){
  const d = [];
  if (F.escape) d.push(["逃课 " + F.escape + " 次", F.escape * 3]);
  if (F.late) d.push(["熬夜 " + F.late + " 次", F.late * 2]);
  const miss = 15 - hwTotal();
  if (miss > 0) d.push(["作业没写完（差 " + miss + " / 15）", Math.round(miss * 2 / 3)]);
  if (F.quiz >= 0 && F.quiz < 60) d.push(["小测 " + F.quiz + " 分", 3]);
  if (F.pres === 0) d.push(["英语展示没上", 3]);
  if (F.caught) d.push([F.caught === 2 ? "思政课缺勤" : "思政点名没答上", 3]);
  if (F.pe) d.push(["体育课缺勤", 3]);
  return d;
}

function cnNum(n){
  const d = ['零','一','二','三','四','五','六','七','八','九'];
  if (n === 100) return '一百';
  if (n < 10) return d[n];
  if (n < 20) return '十' + (n % 10 ? d[n % 10] : '');
  return d[Math.floor(n / 10)] + '十' + (n % 10 ? d[n % 10] : '');
}

const STATS_URL = "";
let _statsSent = false;

function reportStats(sc, rank, achList, debtSum){
  if (!STATS_URL || _statsSent) return;
  _statsSent = true;
  try {
    const payload = JSON.stringify({
      ts: new Date().toISOString(),
      score: sc,
      rank: rank,
      quiz: F.quiz,
      debt: debtSum,
      hw: hwTotal(),
      ach: achList.map(function(a){ return a.t; }),
      flags: {
        escape: F.escape, late: F.late, fengru: F.fengru, vol: F.vol,
        crush: F.crush, exercise: F.exercise, notes: F.notes, pres: F.pres
      }
    });
    if (navigator.sendBeacon){
      navigator.sendBeacon(STATS_URL, new Blob([payload], { type: 'text/plain;charset=UTF-8' }));
    } else {
      fetch(STATS_URL, {
        method: 'POST',
        headers: { 'content-type': 'text/plain;charset=UTF-8' },
        body: payload,
        keepalive: true
      }).catch(function(){});
    }
  } catch (e) {}
}

function shareLoad(src){
  return new Promise(function(res, rej){
    const im = new Image();
    im.onload = function(){ res(im); };
    im.onerror = function(){ rej(new Error('image load failed')); };
    im.src = src;
  });
}

function shareRound(g, x, y, w, h, r){
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

function makeShare(){
  const FONT = '-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif';
  const W = 760, PAD = 30, SCALE = 2, FOOT = 300;
  const inner = W - PAD * 2;

  const stage = document.getElementById('stage');
  const clone = stage.cloneNode(true);
  const again = clone.querySelector('.again');
  if (again) again.parentNode.removeChild(again);

  // 测量高度
  const holder = document.createElement('div');
  holder.style.cssText = 'position:fixed;left:-99999px;top:0;width:' + W + 'px;padding:0 ' + PAD + 'px;box-sizing:border-box;background:#0d1015';
  clone.style.margin = '0';
  holder.appendChild(clone);
  document.body.appendChild(holder);
  const H = Math.ceil(holder.getBoundingClientRect().height);
  document.body.removeChild(holder);

  // 收集样式
  let cssText = '';
  for (let i = 0; i < document.styleSheets.length; i++){
    let rules = null;
    try { rules = document.styleSheets[i].cssRules; } catch(e){ continue; }
    if (!rules) continue;
    for (let j = 0; j < rules.length; j++){
      const t = rules[j].cssText;
      if (t.indexOf('data:image') >= 0) continue;
      cssText += t + '\n';
    }
  }

  // 组装成 SVG 里的 foreignObject
  const wrap = document.createElement('div');
  wrap.setAttribute('xmlns', 'http://www.w3.org/1999/xhtml');
  wrap.style.cssText = 'width:' + inner + 'px;margin:0 auto;font-family:' + FONT +
    ';background:#0d1015;color:#e4e7ed;line-height:1.9;padding:24px 0;box-sizing:border-box';
  const st = document.createElement('style');
  st.textContent = cssText;
  wrap.appendChild(st);
  const box = document.createElement('div');
  box.innerHTML = clone.innerHTML;
  wrap.appendChild(box);

  const xml = new XMLSerializer().serializeToString(wrap);
  const shot = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="' + W + '" height="' + H + '">' +
    '<foreignObject x="0" y="0" width="' + W + '" height="' + H + '">' + xml + '</foreignObject></svg>'
  );

  return Promise.all([shareLoad(SHARE_QR), shareLoad(shot)]).then(function(imgs){
    const qrImg = imgs[0], shotImg = imgs[1];
    const cv = document.createElement('canvas');
    cv.width = W * SCALE;
    cv.height = (H + FOOT) * SCALE;
    const g = cv.getContext('2d');
    g.scale(SCALE, SCALE);

    g.fillStyle = '#0d1015';
    g.fillRect(0, 0, W, H + FOOT);
    g.drawImage(shotImg, 0, 0, W, H);

    // 分隔线
    const grd = g.createLinearGradient(60, 0, W - 60, 0);
    grd.addColorStop(0, 'rgba(224,164,88,0)');
    grd.addColorStop(.5, 'rgba(224,164,88,.55)');
    grd.addColorStop(1, 'rgba(224,164,88,0)');
    g.fillStyle = grd;
    g.fillRect(60, H + 26, W - 120, 1);

    // 二维码白卡
    const qx = 46, qy = H + 56, qs = 196;
    g.save();
    g.shadowColor = 'rgba(0,0,0,.55)';
    g.shadowBlur = 26;
    g.shadowOffsetY = 10;
    g.fillStyle = '#ffffff';
    shareRound(g, qx, qy, qs, qs, 18);
    g.fill();
    g.restore();
    g.drawImage(qrImg, qx + 12, qy + 12, qs - 24, qs - 24);

    // 文案
    g.textAlign = 'left';
    g.textBaseline = 'alphabetic';
    g.fillStyle = '#e0a458';
    g.font = '600 31px ' + FONT;
    g.fillText('扫一扫，我也要玩', 286, H + 118);
    g.fillStyle = '#9aa3b1';
    g.font = '18px ' + FONT;
    g.fillText('模拟人生 · 北航', 286, H + 158);
    g.fillStyle = '#5d6674';
    g.font = '13px ui-monospace,Consolas,monospace';
    g.fillText(SHARE_URL, 286, H + 190);

    // 署名
    g.textAlign = 'right';
    g.fillStyle = '#4b566a';
    g.font = '14px ' + FONT;
    g.fillText('开发者：136', W - 46, H + FOOT - 26);
    g.textAlign = 'left';

    return cv;
  });
}

function shareImage(){
  const btn = document.getElementById('shareBtn');
  if (btn && btn.disabled) return;
  if (btn){ btn.disabled = true; btn.textContent = '生成中…'; }
  makeShare().then(function(cv){
    const a = document.createElement('a');
    a.download = '模拟人生-北航-结算.png';
    a.href = cv.toDataURL('image/png');
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    if (btn){ btn.disabled = false; btn.textContent = '生成分享图'; }
  }).catch(function(err){
    console.error(err);
    if (btn){ btn.disabled = false; btn.textContent = '生成失败，点我重试'; }
  });
}

function showReport(){
  const avgE = energyDays ? energySum / energyDays : S.energy;
  let sc = Math.round(0.34 * S.study + 0.28 * S.mood + 0.22 * S.social + 0.16 * avgE);
  const debt = debtList();
  sc = Math.max(0, Math.min(100, sc - debt.reduce((a, d) => a + d[1], 0)));
  if (F.usj) sc = Math.min(100, sc + 2);   // 环球线的隐藏分

  const perfect = sc >= MAX_SCORE && F.quiz >= QUOTE_TOP;
  const rank = perfect ? "SSS" : sc >= 79 ? "S" : sc >= 70 ? "A" : sc >= 60 ? "B" : sc >= 50 ? "C" : "D";
  const title = TITLES.find(x => x.when()) || TITLES[TITLES.length - 1];

  const ctx = { sc, debt: debt.reduce((a, d) => a + d[1], 0) };
  reportStats(sc, rank, got, debt.reduce((a, d) => a + d[1], 0));
  const got = ACH.filter(a => a.when(ctx));
  const perfectA = got.filter(a => a.t === "完美时间线")[0];
  const others = got.filter(a => a.t !== "完美时间线");
  const perfectHtml = perfectA
    ? `<div class="perfect"><span class="pi">${perfectA.icon}</span><span class="pn">${perfectA.t}</span></div>`
    : "";
  const achHtml = others.map(a => `<div class="a"><span class="ai">${a.icon}</span><span class="an">${a.t}</span></div>`).join("");

  let best = 0;
  try { best = parseInt(localStorage.getItem("week-best") || "0", 10) || 0; } catch(e){ best = 0; }
  const isBest = sc > best;
  if (isBest) { try { localStorage.setItem("week-best", String(sc)); } catch(e){} }

  const order = ["study", "social", "mood", "energy"];
  const labelMap = { study: "学业", social: "社交", mood: "心情", energy: "精力" };
  const vals = { study: S.study, social: S.social, mood: S.mood, energy: avgE };
  const bars = order.map(k => {
    const v = Math.round(vals[k]), n = Math.round(v / 10);
    return `<span class="lk">${labelMap[k]}</span> <span class="fill-${k}">${BAR[n]}</span><span class="blank">${pad(n)}</span> <b>${String(v).padStart(3," ")}</b>`;
  }).join("\n");

  const fileHtml = buildFile().map(x => `<li>${x}</li>`).join("");
  const cmtHtml = buildComment(rank, sc).map(x => `<p>${x}</p>`).join("");

  document.getElementById("hdr").style.display = "none";
  const st = document.getElementById("stage");
  st.className = "report";
  st.innerHTML = `
    <div class="rhead">
      <div class="lab">一 周 结 算</div>
      <div class="rank${rank === "SSS" ? " sss" : ""}">${rank}</div>
      <div class="score">综合评分 <span class="n">${sc}</span> / 100${rank === "SSS" ? " · 理论最高" : isBest ? " · 新的个人最佳" : (best ? " · 个人最佳 " + best : "")}</div>
    </div>
    <div class="title">${title.t}</div>
    <div class="title-sub">${title.s}</div>
    <div class="bars">${bars}</div>
    ${debt.length ? `<h3 class="sec">未 结 账</h3><div class="debt">${debt.map(d => `<span>${d[0]} <b>−${d[1]}</b></span>`).join("")}</div>` : ""}
    ${got.length ? `<h3 class="sec">成 就</h3>
    ${perfectHtml}
    ${others.length ? `<div class="ach">${achHtml}</div>` : ""}` : ""}
    <h3 class="sec">一 周 档 案</h3>
    <ul class="file">${fileHtml}</ul>
    <h3 class="sec">评 语</h3>
    <div class="comment">${cmtHtml}</div>
    <div class="again">
      <button class="pri" id="againBtn">再过一周</button>
      <button id="topBtn">回到开头</button>
      <button id="shareBtn">生成分享图</button>
    </div>
    <div class="foot">— 学院路 37 号 · 明天七点见 —</div>
  `;
  window.scrollTo({ top: 0, behavior: "smooth" });
  document.getElementById("againBtn").onclick = () => restart();
  document.getElementById("topBtn").onclick = () => showIntro();
  const _sb = document.getElementById("shareBtn");
  if (_sb) _sb.onclick = () => shareImage();
}

/* ==================== 引擎 ==================== */
let cur = "d1a";

function resolve(id){
  let g = 0;
  while (g++ < 8) {
    const sc = scenes[id];
    if (sc && typeof sc.guard === "function") {
      const t = sc.guard();
      if (t && t !== id) { id = t; continue; }
    }
    break;
  }
  return id;
}

function renderStats(){
  document.getElementById("stats").innerHTML = META.map(m => {
    const v = Math.round(S[m.k]);
    return `<div class="stat"><span class="k">${m.label}</span>
      <span class="track"><i style="width:${v}%;background:${m.color}"></i></span>
      <span class="v">${v}</span></div>`;
  }).join("");
}

function toMin(t){ const a = t.split(":"); return (+a[0]) * 60 + (+a[1]); }

function renderProg(t){
  const parts = [];
  for (let i = 0; i < 7; i++) {
    let w = 0;
    if (i < day) w = 100;
    else if (i === day) {
      const m = toMin(t);
      w = Math.max(0, Math.min(100, ((m - 420) / (1440 - 420)) * 100));
    }
    parts.push(`<span class="${i < day ? "done" : ""}"><i style="width:${w.toFixed(1)}%"></i></span>`);
  }
  document.getElementById("prog").innerHTML = parts.join("");
}

function render(){
  const sc = scenes[cur];
  const t = (typeof sc.time === "function") ? sc.time() : sc.time;
  document.getElementById("dayName").textContent = DAYS[day];
  document.getElementById("clock").textContent = t;
  document.getElementById("where").textContent = sc.place;
  renderProg(t);

  const stage = document.getElementById("stage");
  stage.className = "";
  const body = sc.text().split("\n").filter(x => x.trim() !== "").map(x => `<p>${x}</p>`).join("");
  const list = sc.choices.filter(c => !c.if || c.if());
  const btns = list.map((c, i) => {
    const locked = !!(c.need && Object.keys(c.need).some(k => S[k] < c.need[k]));
    const tag = locked ? `<em class="lock">${c.needText || "精力不足"}</em>` : "";
    return `<button class="choice${locked ? " locked" : ""}" data-i="${i}" ${locked ? "disabled" : ""} style="animation-delay:${(0.05 + i*0.055).toFixed(3)}s">
      <span class="arrow">›</span><span>${c.t}${tag}</span></button>`;
  }).join("");

  stage.innerHTML = `<div class="place">${sc.place}</div><div class="prose">${body}</div><div class="choices">${btns}</div>`;
  Array.prototype.forEach.call(stage.querySelectorAll(".choice"), btn => {
    btn.onclick = () => { if (btn.disabled) return; pick(list[+btn.dataset.i]); };
  });
  renderStats();
  if (cur === "u4") setTimeout(function () { FW.show("big"); }, 280);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function apply(c){
  if (c.e) for (const k in c.e) S[k] = clamp(S[k] + c.e[k]);
  if (c.f) c.f();
}

function pick(c){
  apply(c);
  if (c.fx) FW.show(c.fx);
  const nx = (typeof c.go === "function") ? c.go() : c.go;
  cur = resolve(nx);
  if (cur === "dayend") nextDay();
  else if (cur === "report") showReport();
  else render();
}

/* ==================== 换日 ==================== */
function nextDay(){
  if (day >= 6) { showReport(); return; }
  day++;
  S.study  = clamp(S.study - 2);
  S.mood   = clamp(S.mood - 2);
  S.social = clamp(S.social - 1);
  S.energy = morningEnergy(day);
  energySum += S.energy; energyDays++;
  cur = DAY_FIRST[day];
  document.getElementById("hdr").style.display = "";
  render();
}

/* ==================== 烟花 ==================== */
const FW = (function () {
  let cv = null, ctx = null, parts = [], raf = 0, until = 0;

  function resize() {
    const d = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.floor(window.innerWidth * d);
    cv.height = Math.floor(window.innerHeight * d);
    ctx.setTransform(d, 0, 0, d, 0, 0);
  }
  function tick(t) {
    step();
    if (parts.length || t < until) raf = requestAnimationFrame(tick);
    else { raf = 0; ctx.clearRect(0, 0, window.innerWidth, window.innerHeight); }
  }
  function start() {
    if (raf) return;
    until = performance.now() + 10000;
    raf = requestAnimationFrame(tick);
  }
  function step() {
    ctx.globalCompositeOperation = "destination-out";
    ctx.fillStyle = "rgba(0,0,0,0.13)";
    ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
    ctx.globalCompositeOperation = "lighter";
    ctx.lineCap = "round";
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.px = p.x; p.py = p.y;
      p.x += p.vx; p.y += p.vy;
      p.vy += 0.028; p.vx *= 0.991; p.vy *= 0.991;
      p.life -= p.decay;
      if (p.life <= 0) { parts.splice(i, 1); continue; }
      ctx.beginPath();
      ctx.moveTo(p.px, p.py);
      ctx.lineTo(p.x, p.y);
      ctx.lineWidth = Math.max(0.6, p.size * p.life);
      ctx.strokeStyle = "hsla(" + p.hue + ",92%," + (50 + p.life * 22) + "%," + (p.life * 0.8) + ")";
      ctx.stroke();
    }
  }
  function burst(x, y, n, baseHue) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 1.6 + Math.pow(Math.random(), 0.5) * 5.4;
      parts.push({
        x: x, y: y, px: x, py: y,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 1, decay: 0.006 + Math.random() * 0.009,
        hue: baseHue + (Math.random() * 30 - 15),
        size: 0.9 + Math.random() * 1.4
      });
    }
    start();
  }
  function show(kind) {
    if (!ctx) return;
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const big = kind === "big";
    const n = big ? 5 : 3;
    for (let i = 0; i < n; i++) {
      setTimeout(function () {
        const x = window.innerWidth * (0.2 + Math.random() * 0.6);
        const y = window.innerHeight * (0.12 + Math.random() * 0.28);
        const hue = i % 3 === 2 ? 202 : 38;
        burst(x, y, i === 0 ? (big ? 130 : 80) : 62, hue);
        boom(i === 0 ? (big ? 1 : 0.55) : 0.38);
      }, i * (big ? 400 : 760));
    }
  }
  function init() {
    cv = document.getElementById("fw");
    if (!cv) return;
    ctx = cv.getContext("2d");
    resize();
    window.addEventListener("resize", resize);
  }
  return { init: init, show: show, burst: burst };
})();

let AC = null;
function boom(level) {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === "suspended") AC.resume();
    const t = AC.currentTime;

    const o = AC.createOscillator(), g = AC.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(150, t);
    o.frequency.exponentialRampToValueAtTime(36, t + 0.42);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.26 * level, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.58);
    o.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t + 0.62);

    const len = Math.floor(AC.sampleRate * 0.75);
    const buf = AC.createBuffer(1, len, AC.sampleRate);
    const ch = buf.getChannelData(0);
    for (let i = 0; i < len; i++) { const k = 1 - i / len; ch[i] = (Math.random() * 2 - 1) * k * k; }
    const src = AC.createBufferSource(); src.buffer = buf;
    const hp = AC.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 1400;
    const ng = AC.createGain(); ng.gain.value = 0.09 * level;
    src.connect(hp); hp.connect(ng); ng.connect(AC.destination);
    src.start(t + 0.03);
  } catch (e) {}
}

/* ==================== 开场 ==================== */
function showIntro(){
  document.getElementById("hdr").style.display = "none";
  const st = document.getElementById("stage");
  st.className = "intro";
  let best = 0;
  try { best = parseInt(localStorage.getItem("week-best") || "0", 10) || 0; } catch(e){ best = 0; }
  st.innerHTML = `
    <h1>模拟人生<span class="dot">·</span><em>北航</em></h1>
    <div class="sub">学院路 37 号</div>
    <button class="start" id="startBtn">开 始</button>
    ${best ? `<div class="best">个人最佳 · ${best} 分</div>` : ""}
    <div class="dev">开发者：136</div>
  `;
  document.getElementById("startBtn").onclick = () => startWeek();
}

function startWeek(){
  Object.assign(S, S0);
  Object.assign(F, F0);
  day = 0; energySum = 0; energyDays = 0;
  S.energy = 72; F.nextEnergy = 70;
  energySum += S.energy; energyDays++;
  document.getElementById("hdr").style.display = "";
  cur = "d1a";
  render();
}

function restart(){ startWeek(); }

showIntro();
FW.init();
